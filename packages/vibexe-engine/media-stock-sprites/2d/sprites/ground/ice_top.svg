<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <defs>
    <linearGradient id="it1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="30%" stop-color="#BBDEFB"/>
      <stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>
  </defs>
  <!-- Main ice body -->
  <rect width="256" height="64" fill="url(#it1)"/>
  <!-- Glossy top highlight -->
  <rect y="0" width="256" height="10" fill="#FFFFFF" opacity="0.35"/>
  <!-- White refraction streaks -->
  <g fill="#FFFFFF" opacity="0.35">
    <rect x="15" y="16" width="35" height="2.5" rx="1.2" transform="rotate(-6 32 17)"/>
    <rect x="80" y="28" width="45" height="2" rx="1" transform="rotate(4 102 29)"/>
    <rect x="160" y="20" width="30" height="2.5" rx="1.2" transform="rotate(-5 175 21)"/>
    <rect x="220" y="35" width="25" height="2" rx="1" transform="rotate(3 232 36)"/>
    <rect x="40" y="42" width="28" height="2" rx="1" transform="rotate(6 54 43)"/>
    <rect x="130" y="48" width="35" height="2" rx="1" transform="rotate(-4 147 49)"/>
  </g>
  <!-- Inner glow patches -->
  <g fill="#FFFFFF" opacity="0.15">
    <ellipse cx="64" cy="32" rx="20" ry="10"/>
    <ellipse cx="192" cy="28" rx="18" ry="9"/>
    <ellipse cx="128" cy="50" rx="22" ry="8"/>
  </g>
  <!-- Subtle blue depth -->
  <g fill="#64B5F6" opacity="0.12">
    <ellipse cx="50" cy="48" rx="20" ry="8"/>
    <ellipse cx="170" cy="52" rx="25" ry="7"/>
  </g>
  <!-- Sparkle points -->
  <g fill="#FFFFFF" opacity="0.65">
    <circle cx="28" cy="8" r="1.5"/><circle cx="100" cy="12" r="1.2"/>
    <circle cx="180" cy="6" r="1.5"/><circle cx="240" cy="10" r="1"/>
    <circle cx="60" cy="38" r="1"/><circle cx="210" cy="42" r="1.2"/>
  </g>
</svg>