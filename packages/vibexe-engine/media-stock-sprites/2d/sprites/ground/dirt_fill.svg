<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <defs>
    <linearGradient id="df1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5C3A0A"/>
    </linearGradient>
  </defs>
  <!-- Main dirt fill -->
  <rect width="256" height="64" fill="url(#df1)"/>
  <!-- Dirt speckle texture -->
  <g fill="#4A2A06" opacity="0.25">
    <circle cx="20" cy="15" r="3"/><circle cx="60" cy="40" r="2"/>
    <circle cx="100" cy="20" r="2.5"/><circle cx="140" cy="50" r="3"/>
    <circle cx="180" cy="10" r="2"/><circle cx="220" cy="35" r="2.5"/>
    <circle cx="40" cy="55" r="2"/><circle cx="120" cy="45" r="1.5"/>
    <circle cx="200" cy="25" r="2"/><circle cx="250" cy="48" r="2.5"/>
    <circle cx="80" cy="8" r="1.5"/><circle cx="160" cy="30" r="2"/>
    <circle cx="240" cy="12" r="1.5"/><circle cx="30" cy="32" r="1.8"/>
  </g>
  <!-- Stone/pebble details -->
  <g fill="#6B4A1A" opacity="0.2">
    <ellipse cx="50" cy="30" rx="6" ry="3.5"/>
    <ellipse cx="150" cy="15" rx="5" ry="3"/>
    <ellipse cx="230" cy="42" rx="7" ry="4"/>
    <ellipse cx="90" cy="52" rx="5" ry="2.5"/>
  </g>
  <!-- Lighter dirt patches -->
  <g fill="#A07A20" opacity="0.12">
    <ellipse cx="75" cy="20" rx="15" ry="8"/>
    <ellipse cx="185" cy="45" rx="18" ry="9"/>
    <ellipse cx="128" cy="32" rx="12" ry="7"/>
  </g>
  <!-- Worm/root lines -->
  <g stroke="#5C3A0A" stroke-width="1" opacity="0.15" fill="none">
    <path d="M30,40 Q50,35 65,42"/>
    <path d="M170,20 Q190,15 205,22"/>
  </g>
</svg>