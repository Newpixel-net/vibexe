<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <defs>
    <linearGradient id="snt1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D68A"/>
      <stop offset="30%" stop-color="#E8C86A"/>
      <stop offset="100%" stop-color="#C8A84A"/>
    </linearGradient>
  </defs>
  <!-- Main sand body -->
  <rect width="256" height="64" fill="url(#snt1)"/>
  <!-- Undulating top edge for sand dune feel -->
  <path d="M0,0 L0,8 Q32,3 64,7 Q96,2 128,6 Q160,3 192,8 Q224,2 256,6 L256,0 Z" fill="#F5E0A0" opacity="0.4"/>
  <!-- Sand grain texture -->
  <g fill="#B8942A" opacity="0.18">
    <circle cx="12" cy="18" r="1.2"/><circle cx="35" cy="40" r="1"/>
    <circle cx="58" cy="12" r="1.5"/><circle cx="78" cy="50" r="1.2"/>
    <circle cx="105" cy="25" r="1"/><circle cx="128" cy="42" r="1.5"/>
    <circle cx="148" cy="15" r="1.2"/><circle cx="172" cy="52" r="1"/>
    <circle cx="195" cy="30" r="1.5"/><circle cx="218" cy="18" r="1.2"/>
    <circle cx="238" cy="45" r="1"/><circle cx="250" cy="22" r="1.5"/>
    <circle cx="45" cy="55" r="1"/><circle cx="90" cy="35" r="1.3"/>
    <circle cx="160" cy="38" r="1"/><circle cx="205" cy="55" r="1.2"/>
  </g>
  <!-- Small pebble/shell details -->
  <g fill="#A08030" opacity="0.15">
    <ellipse cx="42" cy="28" rx="5" ry="2.5"/>
    <ellipse cx="130" cy="48" rx="4" ry="2"/>
    <ellipse cx="210" cy="22" rx="5" ry="2.5"/>
  </g>
  <!-- Wind ripple lines -->
  <g stroke="#D4B55A" stroke-width="0.8" opacity="0.2" fill="none">
    <path d="M10,32 Q40,28 70,32 Q100,28 130,32"/>
    <path d="M140,45 Q170,41 200,45 Q230,41 256,45"/>
  </g>
  <!-- Bottom depth -->
  <rect y="58" width="256" height="6" fill="#8B7535" opacity="0.2"/>
</svg>