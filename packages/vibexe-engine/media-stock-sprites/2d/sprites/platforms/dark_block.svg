<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <defs>
    <linearGradient id="db1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="db2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#455A64"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7E57C2"/>
      <stop offset="50%" stop-color="#5C6BC0"/>
      <stop offset="100%" stop-color="#7E57C2"/>
    </linearGradient>
  </defs>
  <!-- Main obsidian body -->
  <rect x="2" y="2" width="252" height="58" rx="4" fill="url(#db1)"/>
  <!-- Lighter top surface -->
  <rect x="4" y="3" width="248" height="12" rx="3" fill="url(#db2)" opacity="0.6"/>
  <!-- Faint energy/glow vein lines -->
  <g stroke="url(#dbg)" stroke-width="1.2" fill="none" opacity="0.3">
    <path d="M20,35 Q45,20 80,38 Q110,18 140,32"/>
    <path d="M150,45 Q180,25 210,40 Q235,22 250,35"/>
    <path d="M60,50 Q90,40 120,52"/>
    <path d="M180,12 Q200,25 230,15"/>
  </g>
  <!-- Glow nodes at vein intersections -->
  <g fill="#B39DDB" opacity="0.35">
    <circle cx="45" cy="25" r="3"/>
    <circle cx="110" cy="22" r="2.5"/>
    <circle cx="180" cy="30" r="3"/>
    <circle cx="235" cy="26" r="2.5"/>
    <circle cx="90" cy="44" r="2"/>
  </g>
  <!-- Subtle surface shimmer -->
  <g fill="#546E7A" opacity="0.15">
    <ellipse cx="60" cy="20" rx="18" ry="6"/>
    <ellipse cx="160" cy="35" rx="22" ry="7"/>
    <ellipse cx="230" cy="18" rx="15" ry="5"/>
  </g>
  <!-- Edge glow -->
  <rect x="2" y="54" width="252" height="6" rx="3" fill="#0D0D1A" opacity="0.4"/>
  <!-- Tiny sparkle points -->
  <g fill="#E1BEE7" opacity="0.4">
    <circle cx="30" cy="15" r="1"/>
    <circle cx="128" cy="10" r="1.2"/>
    <circle cx="210" cy="42" r="1"/>
    <circle cx="75" cy="48" r="0.8"/>
  </g>
</svg>