<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <defs>
    <linearGradient id="ib1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="40%" stop-color="#BBDEFB"/>
      <stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>
    <linearGradient id="ib2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F2FD"/>
    </linearGradient>
  </defs>
  <!-- Main ice body -->
  <rect x="2" y="2" width="252" height="58" rx="6" fill="url(#ib1)"/>
  <!-- Top glossy highlight -->
  <rect x="4" y="3" width="248" height="12" rx="5" fill="url(#ib2)" opacity="0.6"/>
  <!-- White highlight streaks (refraction lines) -->
  <g fill="#FFFFFF" opacity="0.4">
    <rect x="20" y="18" width="40" height="3" rx="1.5" transform="rotate(-8 40 19)"/>
    <rect x="90" y="30" width="50" height="2.5" rx="1.2" transform="rotate(5 115 31)"/>
    <rect x="170" y="22" width="35" height="2.5" rx="1.2" transform="rotate(-5 187 23)"/>
    <rect x="230" y="35" width="20" height="2" rx="1" transform="rotate(3 240 36)"/>
  </g>
  <!-- Inner glow spots -->
  <g fill="#FFFFFF" opacity="0.2">
    <ellipse cx="60" cy="35" rx="18" ry="10"/>
    <ellipse cx="180" cy="28" rx="15" ry="8"/>
    <ellipse cx="128" cy="45" rx="20" ry="8"/>
  </g>
  <!-- Subtle blue depth shadows -->
  <g fill="#64B5F6" opacity="0.15">
    <ellipse cx="45" cy="48" rx="20" ry="8"/>
    <ellipse cx="150" cy="50" rx="25" ry="7"/>
    <ellipse cx="220" cy="46" rx="18" ry="7"/>
  </g>
  <!-- Sparkle points -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="35" cy="12" r="1.5"/>
    <circle cx="120" cy="15" r="1.2"/>
    <circle cx="200" cy="10" r="1.5"/>
    <circle cx="75" cy="40" r="1"/>
  </g>
  <!-- Bottom edge shadow -->
  <rect x="2" y="54" width="252" height="6" rx="3" fill="#5C9DC5" opacity="0.25"/>
</svg>