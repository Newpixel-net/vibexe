<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <defs>
    <linearGradient id="sb1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    <linearGradient id="sb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BDBDBD"/>
      <stop offset="60%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>
  </defs>
  <!-- Main stone body -->
  <rect x="2" y="2" width="252" height="58" rx="4" fill="url(#sb1)"/>
  <!-- Lighter top surface -->
  <rect x="4" y="3" width="248" height="14" rx="3" fill="url(#sb2)" opacity="0.6"/>
  <!-- Crack lines for texture -->
  <g stroke="#4A4A4A" stroke-width="1.2" fill="none" opacity="0.3">
    <path d="M80,4 L85,20 L78,35"/>
    <path d="M170,6 L175,18 L168,32 L172,45"/>
    <path d="M40,28 L55,32 L60,48"/>
    <path d="M200,22 L215,28 L220,42"/>
    <path d="M120,12 L128,28"/>
    <path d="M30,8 L35,22"/>
    <path d="M240,15 L245,30"/>
  </g>
  <!-- Stone texture - lighter spots -->
  <g fill="#B0B0B0" opacity="0.2">
    <ellipse cx="30" cy="20" rx="14" ry="8"/>
    <ellipse cx="100" cy="38" rx="16" ry="9"/>
    <ellipse cx="190" cy="16" rx="12" ry="7"/>
    <ellipse cx="235" cy="36" rx="13" ry="8"/>
    <ellipse cx="145" cy="22" rx="10" ry="6"/>
  </g>
  <!-- Dark specks -->
  <g fill="#505050" opacity="0.2">
    <circle cx="25" cy="42" r="2"/><circle cx="70" cy="15" r="1.5"/>
    <circle cx="140" cy="48" r="2"/><circle cx="210" cy="12" r="1.5"/>
    <circle cx="245" cy="50" r="1.8"/><circle cx="115" cy="40" r="1.5"/>
  </g>
  <!-- Bottom shadow edge -->
  <rect x="2" y="54" width="252" height="6" rx="3" fill="#424242" opacity="0.35"/>
  <!-- Top highlight edge -->
  <rect x="10" y="4" width="100" height="2" rx="1" fill="#C8C8C8" opacity="0.3"/>
</svg>