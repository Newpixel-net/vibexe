<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64">
  <defs>
    <linearGradient id="fn1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A5A3A"/>
      <stop offset="50%" stop-color="#9A7A5A"/>
      <stop offset="100%" stop-color="#7A5A3A"/>
    </linearGradient>
    <linearGradient id="fn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A08060"/>
      <stop offset="100%" stop-color="#6A4A2A"/>
