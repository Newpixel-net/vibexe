  <!-- Right post -->
  <rect x="78" y="2" width="10" height="58" rx="2" fill="url(#fn2)"/>
  <rect x="80" y="3" width="3" height="56" rx="1" fill="#B0905A" opacity="0.2"/>
  <polygon points="78,2 83,0 88,2" fill="#B0905A" opacity="0.6"/>
