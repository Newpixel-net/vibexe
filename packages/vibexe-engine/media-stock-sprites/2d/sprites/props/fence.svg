  <g fill="#4A3A1A" opacity="0.45">
    <circle cx="13" cy="19" r="1.2"/><circle cx="13" cy="43" r="1.2"/>
    <circle cx="48" cy="19" r="1.2"/><circle cx="48" cy="43" r="1.2"/>
    <circle cx="83" cy="19" r="1.2"/><circle cx="83" cy="43" r="1.2"/>
  </g>
  <!-- Wood grain on posts -->
  <g stroke="#5A3A1A" stroke-width="0.5" opacity="0.15" fill="none">
    <path d="M11,10 Q13,20 11,30"/>
    <path d="M46,12 Q48,22 46,32"/>
    <path d="M81,15 Q83,25 81,35"/>
