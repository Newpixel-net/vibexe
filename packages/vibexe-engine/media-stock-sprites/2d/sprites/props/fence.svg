  </defs>
  <!-- Ground shadow -->
  <ellipse cx="48" cy="62" rx="42" ry="3" fill="#3A2A0A" opacity="0.12"/>
  <!-- Horizontal rails -->
  <rect x="6" y="16" width="84" height="6" rx="2" fill="url(#fn1)"/>
  <rect x="6" y="17" width="84" height="2" rx="1" fill="#B0905A" opacity="0.25"/>
  <rect x="6" y="40" width="84" height="6" rx="2" fill="url(#fn1)"/>
  <rect x="6" y="41" width="84" height="2" rx="1" fill="#B0905A" opacity="0.25"/>
  <!-- Left post -->
  <rect x="8" y="2" width="10" height="58" rx="2" fill="url(#fn2)"/>
  <rect x="10" y="3" width="3" height="56" rx="1" fill="#B0905A" opacity="0.2"/>
  <polygon points="8,2 13,0 18,2" fill="#B0905A" opacity="0.6"/>
  <!-- Center post -->
  <rect x="43" y="2" width="10" height="58" rx="2" fill="url(#fn2)"/>
  <rect x="45" y="3" width="3" height="56" rx="1" fill="#B0905A" opacity="0.2"/>
