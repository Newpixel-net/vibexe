<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="rk1" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="70%" stop-color="#6B7F8A"/>
      <stop offset="100%" stop-color="#455A64"/>
    </radialGradient>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="33" cy="60" rx="26" ry="4" fill="#2C3E40" opacity="0.15"/>
  <!-- Main rock shape -->
  <path d="M8,50 L4,35 L10,18 L22,8 L40,5 L52,12 L58,28 L55,45 L44,55 L20,56Z" fill="url(#rk1)"/>
  <!-- Highlight face (top-left lit) -->
  <path d="M10,18 L22,8 L40,5 L35,20 L18,28Z" fill="#B0BEC5" opacity="0.35"/>
  <!-- Mid-tone face -->
  <path d="M40,5 L52,12 L48,25 L35,20Z" fill="#90A4AE" opacity="0.2"/>
  <!-- Shadow face (bottom-right) -->
  <path d="M55,45 L44,55 L20,56 L8,50 L15,40 L42,38Z" fill="#37474F" opacity="0.25"/>
  <!-- Crack/vein lines -->
  <g stroke="#455A64" stroke-width="0.8" fill="none" opacity="0.3">
    <path d="M18,28 L30,32 L42,25"/>
    <path d="M25,40 L35,38"/>
    <path d="M15,35 L22,30"/>
  </g>
  <!-- Surface speckles -->
  <g fill="#546E7A" opacity="0.2">
    <circle cx="20" cy="22" r="1.5"/>
    <circle cx="38" cy="15" r="1"/>
    <circle cx="30" cy="42" r="1.5"/>
    <circle cx="48" cy="35" r="1"/>
  </g>
  <!-- Bright highlight spot -->
  <ellipse cx="28" cy="14" rx="6" ry="4" fill="#CFD8DC" opacity="0.3" transform="rotate(-15 28 14)"/>
</svg>