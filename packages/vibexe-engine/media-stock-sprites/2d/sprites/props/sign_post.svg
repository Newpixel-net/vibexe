<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sp1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C3A1A"/>
      <stop offset="50%" stop-color="#7A5A3A"/>
      <stop offset="100%" stop-color="#5C3A1A"/>
    </linearGradient>
    <linearGradient id="sp2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A08050"/>
      <stop offset="100%" stop-color="#7A5A30"/>
    </linearGradient>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="32" cy="62" rx="14" ry="3" fill="#3A2A0A" opacity="0.15"/>
  <!-- Post -->
  <rect x="28" y="22" width="8" height="42" rx="1.5" fill="url(#sp1)"/>
  <rect x="30" y="23" width="3" height="40" rx="1" fill="#8A6A4A" opacity="0.2"/>
  <!-- Post top cap -->
  <ellipse cx="32" cy="22" rx="5" ry="2" fill="#7A5A3A"/>
  <!-- Sign board -->
  <rect x="6" y="6" width="52" height="22" rx="3" fill="url(#sp2)"/>
  <!-- Sign board plank lines -->
  <g stroke="#5A3A10" stroke-width="0.8" opacity="0.25">
    <line x1="6" y1="13" x2="58" y2="13"/>
    <line x1="6" y1="21" x2="58" y2="21"/>
  </g>
  <!-- Sign board highlight -->
  <rect x="8" y="7" width="30" height="3" rx="1.5" fill="#C0A060" opacity="0.25"/>
  <!-- Sign board edge -->
  <rect x="5" y="5" width="54" height="24" rx="4" fill="none" stroke="#4A2A0A" stroke-width="2"/>
  <!-- Arrow shape on sign pointing right -->
  <path d="M58,17 L62,12 L62,22Z" fill="url(#sp2)"/>
  <path d="M58,17 L62,12 L62,22Z" fill="none" stroke="#4A2A0A" stroke-width="1.5"/>
  <!-- Nail connecting sign to post -->
  <circle cx="32" cy="17" r="2" fill="#5A4A3A" opacity="0.5"/>
  <circle cx="32" cy="17" r="0.8" fill="#8A7A6A" opacity="0.4"/>
  <!-- Wood grain on post -->
  <g stroke="#4A2A0A" stroke-width="0.4" opacity="0.15" fill="none">
    <path d="M30,30 Q32,38 30,46"/>
    <path d="M34,35 Q36,43 34,51"/>
  </g>
</svg>