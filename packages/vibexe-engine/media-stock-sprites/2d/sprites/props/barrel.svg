<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="br1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6A4A20"/>
      <stop offset="30%" stop-color="#8D6E40"/>
      <stop offset="70%" stop-color="#8D6E40"/>
      <stop offset="100%" stop-color="#6A4A20"/>
    </linearGradient>
    <linearGradient id="br2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A5A5A"/>
      <stop offset="50%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#5A5A5A"/>
    </linearGradient>
  </defs>
  <!-- Barrel body - bulging shape -->
  <path d="M14,10 Q8,32 14,54 L50,54 Q56,32 50,10 Z" fill="url(#br1)"/>
  <!-- Wood stave lines -->
  <g stroke="#5A3A10" stroke-width="0.8" opacity="0.25">
    <line x1="22" y1="10" x2="20" y2="54"/>
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="42" y1="10" x2="44" y2="54"/>
  </g>
  <!-- Wood grain -->
  <g stroke="#7A5A28" stroke-width="0.5" opacity="0.15" fill="none">
    <path d="M18,18 Q20,24 18,30"/>
    <path d="M36,22 Q38,28 36,34"/>
    <path d="M46,38 Q48,44 46,50"/>
  </g>
  <!-- Top ellipse (lid) -->
  <ellipse cx="32" cy="10" rx="18" ry="6" fill="#A08050"/>
  <ellipse cx="32" cy="10" rx="18" ry="6" fill="none" stroke="#5A3A10" stroke-width="1.5"/>
  <ellipse cx="30" cy="9" rx="8" ry="3" fill="#B89060" opacity="0.3"/>
  <!-- Metal bands -->
  <path d="M12,20 Q8,20 12,20 L52,20 Q56,20 52,20" stroke="url(#br2)" stroke-width="3.5" fill="none"/>
  <path d="M12,44 Q8,44 12,44 L52,44 Q56,44 52,44" stroke="url(#br2)" stroke-width="3.5" fill="none"/>
  <!-- Band rivets -->
  <g fill="#6A6A6A" opacity="0.5">
    <circle cx="16" cy="20" r="1.5"/><circle cx="48" cy="20" r="1.5"/>
    <circle cx="16" cy="44" r="1.5"/><circle cx="48" cy="44" r="1.5"/>
  </g>
  <!-- Light highlight on left -->
  <path d="M16,12 Q13,32 16,52" stroke="#B89060" stroke-width="2" fill="none" opacity="0.25"/>
  <!-- Bottom shadow -->
  <ellipse cx="32" cy="58" rx="20" ry="3" fill="#3A2A0A" opacity="0.15"/>
</svg>