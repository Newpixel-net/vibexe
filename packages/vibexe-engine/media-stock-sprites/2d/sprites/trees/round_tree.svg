<svg xmlns="http://www.w3.org/2000/svg" width="128" height="256" viewBox="0 0 128 256">
  <defs>
    <radialGradient id="rt1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7BC67B"/>
      <stop offset="70%" stop-color="#4A9A4A"/>
      <stop offset="100%" stop-color="#2D6B2D"/>
    </radialGradient>
    <linearGradient id="rtk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C3A1A"/>
      <stop offset="50%" stop-color="#7A5A3A"/>
      <stop offset="100%" stop-color="#4A2A0A"/>
    </linearGradient>
  </defs>
  <!-- Trunk with bark gradient -->
  <rect x="52" y="160" width="24" height="96" rx="4" fill="url(#rtk)"/>
  <!-- Bark highlight stripe -->
  <rect x="60" y="162" width="6" height="90" rx="2" fill="#8A6A4A" opacity="0.3"/>
  <!-- Root flare -->
  <path d="M48,248 Q52,240 52,232 L76,232 Q76,240 80,248 L88,256 L40,256 Z" fill="#5C3A1A"/>
  <!-- Branch stubs -->
  <path d="M52,190 L35,175 L40,172 L56,186Z" fill="#6A4A2A" opacity="0.8"/>
  <path d="M76,180 L95,168 L92,165 L72,178Z" fill="#6A4A2A" opacity="0.8"/>
  <!-- Canopy - multiple overlapping ellipses for leafy look -->
  <ellipse cx="64" cy="120" rx="52" ry="48" fill="url(#rt1)"/>
  <ellipse cx="40" cy="130" rx="35" ry="32" fill="#4A9A4A" opacity="0.8"/>
  <ellipse cx="88" cy="125" rx="38" ry="35" fill="#3D8A3D" opacity="0.7"/>
  <ellipse cx="64" cy="100" rx="40" ry="35" fill="#5CB85C" opacity="0.75"/>
  <ellipse cx="48" cy="110" rx="28" ry="25" fill="#52B252" opacity="0.6"/>
  <ellipse cx="80" cy="105" rx="30" ry="27" fill="#48A048" opacity="0.55"/>
  <!-- Light dapple highlights -->
  <g fill="#8FE08F" opacity="0.4">
    <ellipse cx="50" cy="105" rx="12" ry="8"/>
    <ellipse cx="78" cy="115" rx="10" ry="7"/>
    <ellipse cx="55" cy="135" rx="8" ry="6"/>
    <ellipse cx="72" cy="92" rx="9" ry="6"/>
  </g>
  <!-- Shadow underneath canopy on trunk -->
  <ellipse cx="64" cy="165" rx="30" ry="6" fill="#1A3A14" opacity="0.25"/>
  <!-- Ground shadow -->
  <ellipse cx="64" cy="254" rx="40" ry="4" fill="#1A3A14" opacity="0.15"/>
</svg>