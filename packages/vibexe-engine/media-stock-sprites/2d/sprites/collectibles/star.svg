<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sg1" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFF00"/>
      <stop offset="40%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#E6A800"/>
    </radialGradient>
    <radialGradient id="sg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFF80"/>
      <stop offset="100%" stop-color="#FFD60000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="16" cy="16" r="15" fill="url(#sg2)" opacity="0.3"/>
  <!-- Star body -->
  <polygon points="16,2 19.5,11 29,11 21.5,17 24,27 16,21 8,27 10.5,17 3,11 12.5,11" fill="url(#sg1)"/>
  <!-- Inner lighter star -->
  <polygon points="16,6 18.5,12 25,12 20,16.5 22,23 16,19 10,23 12,16.5 7,12 13.5,12" fill="#FFFF00" opacity="0.4"/>
  <!-- Highlight on upper arm -->
  <polygon points="16,3 18,10 16,7" fill="#FFFFFF" opacity="0.4"/>
  <!-- Edge outline -->
  <polygon points="16,2 19.5,11 29,11 21.5,17 24,27 16,21 8,27 10.5,17 3,11 12.5,11" fill="none" stroke="#B8860B" stroke-width="0.8"/>
  <!-- Sparkle cross -->
  <g fill="#FFFFFF" opacity="0.6">
    <rect x="15" y="8" width="2" height="5" rx="1"/>
    <rect x="13.5" y="9.5" width="5" height="2" rx="1"/>
  </g>
  <!-- Tiny sparkle on right -->
  <circle cx="23" cy="13" r="0.8" fill="#FFFFFF" opacity="0.45"/>
</svg>