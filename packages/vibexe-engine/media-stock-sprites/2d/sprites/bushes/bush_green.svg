<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5CB85C"/>
      <stop offset="100%" stop-color="#2D6B2D"/>
    </radialGradient>
    <radialGradient id="bg2" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#66CC66"/>
      <stop offset="100%" stop-color="#3A8A3A"/>
    </radialGradient>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="48" cy="60" rx="40" ry="4" fill="#1A3A14" opacity="0.2"/>
  <!-- Back leaf cluster -->
  <ellipse cx="48" cy="42" rx="44" ry="22" fill="url(#bg1)"/>
  <!-- Left lobe -->
  <ellipse cx="28" cy="38" rx="28" ry="20" fill="#4A9A4A" opacity="0.8"/>
  <!-- Right lobe -->
  <ellipse cx="68" cy="40" rx="30" ry="21" fill="#3D8A3D" opacity="0.75"/>
  <!-- Top cluster -->
  <ellipse cx="48" cy="30" rx="32" ry="18" fill="url(#bg2)" opacity="0.7"/>
