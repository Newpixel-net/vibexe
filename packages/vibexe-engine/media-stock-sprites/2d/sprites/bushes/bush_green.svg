  <ellipse cx="20" cy="42" rx="12" ry="8" fill="#4A9A4A" opacity="0.5"/>
  <ellipse cx="76" cy="40" rx="10" ry="7" fill="#3D8A3D" opacity="0.45"/>
  <ellipse cx="48" cy="24" rx="14" ry="9" fill="#5CB85C" opacity="0.5"/>
